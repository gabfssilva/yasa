# configuration/shared/tools/get-weather.yaml
tool:
  id: "shared/get-weather"
  name: "get_weather"
  type: "http"
  description: "Busca dados climáticos atuais (temperatura, umidade, precipitação, vento) para uma localização geográfica usando a API do Open-Meteo"
  endpoint:
    url: "https://api.open-meteo.com/v1/forecast?current=temperature_2m,relative_humidity_2m,precipitation,weather_code,wind_speed_10m,wind_direction_10m&timezone=auto&temperature_unit=celsius"
    method: "GET"
    timeout_ms: 60000
  parameters:
    $schema: "http://json-schema.org/draft-07/schema#"
    type: object
    properties:
      latitude:
        type: number
        description: "Latitude da localização"
      longitude:
        type: number
        description: "Longitude da localização"
    required:
      - latitude
      - longitude
  policies:
    retries: 3
    rate_limit_per_min: 100
