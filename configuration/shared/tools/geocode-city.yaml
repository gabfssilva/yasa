# configuration/shared/tools/geocode-city.yaml
tool:
  id: "shared/geocode-city"
  name: "geocode_city"
  type: "http"
  description: "Busca coordenadas geográficas (latitude e longitude) de uma cidade usando a API de Geocoding do Open-Meteo"
  endpoint:
    url: "https://geocoding-api.open-meteo.com/v1/search"
    method: "GET"
    timeout_ms: 60000
  parameters:
    $schema: "http://json-schema.org/draft-07/schema#"
    type: object
    properties:
      name:
        type: string
        description: "Nome da cidade a ser buscada"
    required:
      - name
  policies:
    retries: 3
    rate_limit_per_min: 100
